name: CI Build FAP

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uFBT
        run: python -m pip install --upgrade pip ufbt

      - name: Build FAP
        run: ufbt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gauge_tool-fap-ci-${{ github.sha }}
          path: |
            dist/gauge_tool.fap
            dist/debug/gauge_tool_d.elf
          if-no-files-found: error
