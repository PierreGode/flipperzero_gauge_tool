name: Build and Release FAP

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uFBT
        run: python -m pip install --upgrade pip ufbt

      - name: Build FAP
        run: ufbt

      - name: Generate checksum
        run: sha256sum dist/gauge_tool.fap > dist/gauge_tool.fap.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gauge_tool-fap-${{ github.ref_name }}
          path: |
            dist/gauge_tool.fap
            dist/gauge_tool.fap.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gauge_tool.fap
            dist/gauge_tool.fap.sha256
          generate_release_notes: true
